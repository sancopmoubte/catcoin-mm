[package]
name = "catcoin_light_client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "猫猫币（MM）候选链的 Rust 轻客户端验证核心"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "=1.0.204", features = ["derive"] }
serde_json = "=1.0.120"
jni = "0.21"
jni-sys = "=0.3.0"
typenum = "=1.17.0"

[profile.release]
lto = true
codegen-units = 1
