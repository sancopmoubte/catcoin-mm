name: 部署猫猫币静态 PWA 到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - wallet-static/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取公开源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wallet-static/pnpm-lock.yaml
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装、测试并构建静态 PWA
        working-directory: wallet-static
        env:
          VITE_BASE_PATH: /catcoin-mm/
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: wallet-static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
